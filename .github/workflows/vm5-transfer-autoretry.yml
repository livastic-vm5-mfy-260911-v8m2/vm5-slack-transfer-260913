name: VM5 Transfer AutoRetry Provenance
on:
  workflow_dispatch:
jobs:
  vm5-transfer-retry-job:
    runs-on: ubuntu-latest
    steps:
      - name: Controlled first-attempt failure
        shell: bash
        run: |
          echo "VM5_TRANSFER_AUTORETRY attempt=$GITHUB_RUN_ATTEMPT"
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            echo "controlled first-attempt failure"
            exit 1
          fi
          echo "retry attempt succeeded"
